      :root {

        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      body {
        margin: 0;
        padding: 0;
        font:
          14px -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        background: #fff;
        color: #000;
      }
      img {
        max-width: 100%;
      }
      [hidden]:not([hidden="until-found" i]) {

      }

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap"
    />
    <style>
      /* Layout: dua kolom. Kiri = kartu wawancara (satu pertanyaan per layar). Kanan = panel penguat yang terisi dari data sekolah saat orang tua menjawab. */
      :root {
        --font-sans:
          "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          sans-serif;
        --font-mono:
          "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
        --font-display: "Instrument Serif", Georgia, "Times New Roman", serif;
        --radius: 0.5rem;
        --background: hsl(150 14% 98%);
        --foreground: hsl(160 30% 8%);
        --card: hsl(0 0% 100%);
        --muted: hsl(150 12% 94%);
        --muted-foreground: hsl(155 8% 38%);
        --border: hsl(150 12% 87%);
        --primary: hsl(158 62% 22%);
        --primary-foreground: hsl(150 20% 98%);
        --soft: hsl(152 40% 93%);
        --ring: hsl(158 62% 30%);
        --warn: hsl(32 90% 30%);
        --warn-bg: hsl(42 92% 93%);
        --warn-border: hsl(40 70% 78%);
        --danger: hsl(0 70% 42%);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --background: hsl(160 20% 6%);
          --foreground: hsl(150 12% 95%);
          --card: hsl(160 18% 9%);
          --muted: hsl(158 14% 14%);
          --muted-foreground: hsl(150 8% 66%);
          --border: hsl(158 12% 19%);
          --primary: hsl(152 55% 52%);
          --primary-foreground: hsl(160 30% 8%);
          --soft: hsl(158 30% 14%);
          --ring: hsl(152 55% 52%);
          --warn: hsl(40 90% 66%);
          --warn-bg: hsl(38 40% 14%);
          --warn-border: hsl(38 40% 26%);
          --danger: hsl(0 85% 68%);
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --background: hsl(160 20% 6%);
        --foreground: hsl(150 12% 95%);
        --card: hsl(160 18% 9%);
        --muted: hsl(158 14% 14%);
        --muted-foreground: hsl(150 8% 66%);
        --border: hsl(158 12% 19%);
        --primary: hsl(152 55% 52%);
        --primary-foreground: hsl(160 30% 8%);
        --soft: hsl(158 30% 14%);
        --ring: hsl(152 55% 52%);
        --warn: hsl(40 90% 66%);
        --warn-bg: hsl(38 40% 14%);
        --warn-border: hsl(38 40% 26%);
        --danger: hsl(0 85% 68%);
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }
      body {
        background: var(--background);
        color: var(--foreground);
        font-family: var(--font-sans);
        font-size: 14px;
        line-height: 1.55;
        padding-block: 20px 56px;
        padding-left: max(16px, env(safe-area-inset-left, 0px));
        padding-right: max(16px, env(safe-area-inset-right, 0px));
        -webkit-font-smoothing: antialiased;
      }
      .wrap {
        max-width: 1120px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 28px;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1,
      h2 {
        text-wrap: balance;
      }
      .display {
        font-family: var(--font-display);
        font-weight: 400;
        letter-spacing: -0.01em;
        line-height: 1.08;
      }
      .mono {
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
      }
      .muted {
        color: var(--muted-foreground);
      }
      .eyebrow {
        font-size: 11.5px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted-foreground);
        font-weight: 500;
      }

      /* Topbar */
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }
      .brand-mark {
        width: 34px;
        height: 34px;
        border-radius: var(--radius);
        background: var(--primary);
        color: var(--primary-foreground);
        display: grid;
        place-items: center;
        flex: none;
      }
      .brand-name {
        font-weight: 600;
        font-size: 14px;
        line-height: 1.2;
      }
      .brand-sub {
        font-size: 12px;
        color: var(--muted-foreground);
      }
      .tabs {
        display: inline-flex;
        padding: 3px;
        background: var(--muted);
        border-radius: calc(var(--radius) + 2px);
        gap: 2px;
      }
      .tab {
        appearance: none;
        border: 0;
        background: transparent;
        color: var(--muted-foreground);
        font: inherit;
        font-weight: 500;
        padding: 6px 14px;
        border-radius: var(--radius);
        cursor: pointer;
      }
      .tab[aria-selected="true"] {
        background: var(--card);
        color: var(--foreground);
        box-shadow: 0 1px 2px hsl(0 0% 0% / 0.08);
      }
      .tab:focus-visible,
      .btn:focus-visible,
      .chip:focus-visible,
      summary:focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: 2px;
      }

      /* Grid */
      .grid {
        display: grid;
        grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
        gap: 20px;
        align-items: start;
      }
      @media (max-width: 880px) {
        .grid {
          grid-template-columns: minmax(0, 1fr);
        }
      }
      .stack {
        display: flex;
        flex-direction: column;
        gap: 16px;
        min-width: 0;
      }
      .row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: center;
      }
      .row.between {
        justify-content: space-between;
      }

      /* Card */
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: calc(var(--radius) + 4px);
        padding: 22px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        min-width: 0;
      }
      .card.flat {
        background: var(--muted);
        border-color: transparent;
      }
      .card-title {
        font-weight: 600;
        font-size: 15px;
      }

      /* Form */
      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 0;
      }
      .field label {
        font-weight: 500;
        font-size: 13px;
      }
      .input,
      .select,
      .textarea {
        width: 100%;
        font: inherit;
        color: var(--foreground);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: calc(var(--radius) - 2px);
        padding: 8px 12px;
        min-height: 36px;
      }
      .textarea {
        min-height: 132px;
        resize: vertical;
        line-height: 1.55;
      }
      .input:focus,
      .select:focus,
      .textarea:focus {
        outline: none;
        border-color: var(--ring);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--ring) 28%, transparent);
      }
      .two {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }
      @media (max-width: 560px) {
        .two {
          grid-template-columns: minmax(0, 1fr);
        }
      }
      .err {
        color: var(--danger);
        font-size: 13px;
      }

      /* Buttons */
      .btn {
        appearance: none;
        font: inherit;
        font-weight: 500;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        height: 36px;
        padding: 0 16px;
        border-radius: calc(var(--radius) - 2px);
        border: 1px solid transparent;
        cursor: pointer;
        transition:
          background-color 0.15s,
          border-color 0.15s;
      }
      .btn-primary {
        background: var(--primary);
        color: var(--primary-foreground);
      }
      .btn-primary:hover {
        background: color-mix(in srgb, var(--primary) 88%, var(--foreground));
      }
      .btn-outline {
        background: var(--card);
        border-color: var(--border);
        color: var(--foreground);
      }
      .btn-outline:hover {
        background: var(--muted);
      }
      .btn-ghost {
        background: transparent;
        color: var(--muted-foreground);
      }
      .btn-ghost:hover {
        background: var(--muted);
        color: var(--foreground);
      }
      .btn-sm {
        height: 30px;
        padding: 0 10px;
        font-size: 13px;
      }
      .btn[disabled] {
        opacity: 0.5;
        cursor: not-allowed;
      }

      /* Chips + badge */
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .chip {
        appearance: none;
        font: inherit;
        font-size: 12.5px;
        padding: 4px 11px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--foreground);
        cursor: pointer;
      }
      .chip:hover {
        background: var(--soft);
        border-color: var(--primary);
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 11.5px;
        font-weight: 500;
        padding: 2px 8px;
        border-radius: 999px;
        border: 1px solid var(--border);
        color: var(--muted-foreground);
        white-space: nowrap;
      }
      .badge.ok {
        background: var(--soft);
        color: var(--primary);
        border-color: transparent;
      }
      .badge.warn {
        background: var(--warn-bg);
        color: var(--warn);
        border-color: var(--warn-border);
      }

      /* Progress */
      .progress {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: 1fr;
        gap: 6px;
      }
      .seg {
        height: 4px;
        border-radius: 4px;
        background: var(--border);
      }
      .seg.on {
        background: var(--primary);
      }

      /* Question */
      .q-text {
        font-size: clamp(24px, 3.6vw, 32px);
      }
      .hint {
        background: var(--muted);
        border-radius: var(--radius);
        padding: 10px 12px;
        font-size: 13px;
        color: var(--muted-foreground);
      }
      .hint b {
        color: var(--foreground);
        font-weight: 600;
      }

      /* Penguat panel */
      .panel {
        background: var(--soft);
        border: 1px solid var(--border);
        border-radius: calc(var(--radius) + 4px);
        padding: 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        min-width: 0;
      }
      .panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .live-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--primary);
        display: inline-block;
        margin-right: 6px;
      }
      .group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .said {
        font-family: var(--font-display);
        font-style: italic;
        font-size: 17px;
        line-height: 1.3;
        color: var(--foreground);
      }
      .item {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 12px 14px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .item-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 8px;
      }
      .item-title {
        font-weight: 600;
      }
      .item-detail {
        color: var(--muted-foreground);
      }
      .src {
        font-size: 12px;
        color: var(--muted-foreground);
      }
      .empty {
        color: var(--muted-foreground);
        padding: 14px;
        border: 1px dashed var(--border);
        border-radius: var(--radius);
        background: var(--card);
      }

      /* Result */
      .result-head {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .result-title {
        font-size: clamp(32px, 5.4vw, 52px);
      }
      .meter {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .meter-num {
        font-size: 44px;
        line-height: 1;
      }
      .bar {
        height: 8px;
        background: var(--border);
        border-radius: 8px;
        overflow: hidden;
      }
      .bar > i {
        display: block;
        height: 100%;
        background: var(--primary);
        border-radius: 8px;
      }
      .notice {
        background: var(--warn-bg);
        color: var(--warn);
        border: 1px solid var(--warn-border);
        border-radius: var(--radius);
        padding: 10px 12px;
      }
      .pair {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr);
        gap: 18px;
      }
      @media (max-width: 720px) {
        .pair {
          grid-template-columns: minmax(0, 1fr);
          gap: 12px;
        }
      }
      .close-quote {
        font-family: var(--font-display);
        font-size: clamp(20px, 2.8vw, 26px);
        line-height: 1.3;
      }
      details {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 10px 14px;
        background: var(--card);
      }
      summary {
        cursor: pointer;
        font-weight: 500;
      }
      .qa {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding-top: 12px;
      }
      .plain {
        font-family: var(--font-mono);
        font-size: 12.5px;
        min-height: 200px;
      }

      /* Data */
      .item-edit {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        background: var(--card);
      }
      .check {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
      }
      .check input {
        width: 16px;
        height: 16px;
        accent-color: var(--primary);
      }
      .stat {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .hist-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        padding: 16px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        flex-wrap: wrap;
      }
      .hist-meta {
        display: flex;
        gap: 14px;
        align-items: center;
        flex-wrap: wrap;
        font-size: 12.5px;
        color: var(--muted-foreground);
      }
      @media print {
        body {
          background: #fff !important;
          color: #000 !important;
          padding: 10px !important;
        }
        .topbar, .tabs, .btn, .notice, details summary, .row button, #hist-search {
          display: none !important;
        }
        .card, .panel, .item {
          border: 1px solid #ddd !important;
          break-inside: avoid;
          box-shadow: none !important;
        }
        .wrap {
          max-width: 100% !important;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>

    <div class="wrap">
      <header class="topbar" id="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <svg
              width="20"
              height="20"

        </div>
      </header>
      <main id="view"></main>
    </div>

            .map(function (s) {

            for (var i = 0; i < sents.length; i++) {

                  return r.test(sents[i]);

              ) {
                out.push({ theme: t, snippet: clip(sents[i], 150) });

          var ids = {};
          Object.keys(hits).forEach(function (k) {
            ids[k] = 1;
          });
          Object.keys(concerns).forEach(function (k) {
            ids[k] = 1;
          });
          var all = Object.keys(ids);
          var covered = all.filter(function (k) {
            return itemsFor(k).length > 0;
          });
          var order = Object.keys(hits).sort(function (a, b) {
            return hits[b].length - hits[a].length;
          });
          return {
            hits: hits,
            concerns: concerns,
            order: order,
            total: all.length,
            covered: covered.length,
          };
        }

        function questionView() {
          var i = state.step - 1,
            q = QUESTIONS[i],

          return (
            '<div class="grid"><div class="card step-card">' +
            '<div class="stack" style="gap:10px"><div class="row between"><span class="eyebrow">Pertanyaan ' +
            state.step +
            " dari " +
            N +
            "</span>" +
            '<span class="badge">' +
            esc(state.profile.sapaan) +
            " " +
            esc(state.profile.ortu) +
            '</span></div><div class="progress">' +
            segs +
            "</div></div>" +
            '<h2 class="display q-text">' +
            esc(fill(q.q)) +
            "</h2>" +
            '<div class="hint"><b>Panduan:</b> ' +
            esc(fill(q.hint)) +
            "</div>" +
            '<div class="field"><label for="answer">Jawaban ' +
            esc(sap()) +
            "</label>" +
            '<textarea class="textarea" id="answer" placeholder="Ketik jawaban dengan kata-kata orang tua sendiri..."></textarea></div>' +
            '<div class="stack" style="gap:8px"><span class="eyebrow">Jawaban cepat</span><div class="chips">' +
            q.chips
              .map(function (c, ci) {
                return (
                  '<button type="button" class="chip" data-action="chip" data-i="' +
                  ci +
                  '">' +
                  esc(c) +
                  "</button>"
                );
              })
              .join("") +
            "</div></div>" +
            '<div class="row between"><button class="btn btn-outline" data-action="prev">Kembali</button>' +
            '<button class="btn btn-primary" data-action="next">' +
            (state.step === N ? "Lihat ringkasan" : "Lanjut") +
            "</button></div>" +
            "</div>" +
            '<aside class="panel"><div class="panel-head"><span class="card-title"><i class="live-dot"></i>Penguat dari data sekolah</span><span class="badge" id="pg-count">0 tema</span></div>' +
            '<div class="stack" id="penguat"></div></aside></div>'
          );
        }

        function resultView() {
          var r = buildResult(),
            p = state.profile,
            s = state.school;
          var pct = r.total ? Math.round((r.covered / r.total) * 100) : 0;
          var unv = usedUnverified(r);
          var h =
            '<div class="stack" style="gap:24px">' +
            '<div class="result-head" data-anim="r"><span class="eyebrow">Ringkasan wawancara · ' +
            esc(
              new Date().toLocaleDateString("id-ID", {
                day: "numeric",
                month: "long",
                year: "numeric",
              }),
            ) +
            "</span>" +
            '<h1 class="display result-title">Ringkasan untuk ' +
            esc(p.sapaan) +
            " " +
            esc(p.ortu) +
            "</h1>" +
            '<p class="muted">Calon murid: ' +
            esc(p.anak) +
            (p.pewawancara ? " · Pewawancara: " + esc(p.pewawancara) : "") +
            "</p></div>";
          h +=
            '<div class="grid"><div class="card meter" data-anim="r"><span class="eyebrow">Harapan yang terjawab data sekolah</span>' +
            '<div class="row" style="align-items:baseline;gap:10px"><span class="display meter-num" id="meter-num" data-to="' +
            r.covered +
            '">' +
            r.covered +
            '</span><span class="muted">dari ' +
            r.total +
            " hal yang disampaikan</span></div>" +
            '<div class="bar"><i id="meter-bar" style="width:' +
            pct +
            '%"></i></div>' +
            '<p class="muted">' +
            (r.total === 0
              ? "Jawaban belum menyebut tema yang dikenali. Kembali ke wawancara dan gali dengan contoh yang lebih konkret."
              : "Setiap hal yang disampaikan " +
                esc(sap()) +
                " dicocokkan dengan data di tab Data sekolah. Hal yang belum ada datanya perlu dijawab langsung oleh pewawancara.") +
            "</p></div>";
          h +=
            '<div class="card flat" data-anim="r"><span class="card-title">Kalimat penutup untuk pewawancara</span><p class="close-quote">' +
            esc(closing(r)) +
            "</p></div></div>";
          if (unv > 0)
            h +=
              '<div class="notice" data-anim="r">Ringkasan ini memakai ' +
              unv +
              " data contoh yang belum diverifikasi. Periksa dan ganti di tab Data sekolah sebelum dibagikan ke orang tua.</div>";

          h +=
            '<div class="stack"><h2 class="card-title" style="font-size:18px">Yang ' +
            esc(sap()) +
            " cari, dan jawaban sekolah</h2>";
          if (!r.order.length)
            h +=
              '<div class="empty">Belum ada tema yang dikenali dari jawaban.</div>';
          r.order.forEach(function (id) {
            h += themeCard(id, r.hits[id], false);
          });
          h += "</div>";

          var cids = Object.keys(r.concerns);
          if (cids.length) {
            h +=
              '<div class="stack"><h2 class="card-title" style="font-size:18px">Pertimbangan yang perlu dijawab</h2>';
            cids.forEach(function (id) {
              h += themeCard(id, r.concerns[id], true);
            });
            h += "</div>";
          }

          h +=
            '<details data-anim="r"><summary>Jawaban lengkap orang tua</summary>' +
            QUESTIONS.map(function (q, i) {
              return (
                '<div class="qa"><span class="eyebrow">' +
                (i + 1) +
                ". " +
                esc(fill(q.q)) +
                "</span><span>" +
                (state.answers[i] && state.answers[i].trim()
                  ? esc(state.answers[i])
                  : '<span class="muted">Tidak diisi</span>') +
                "</span></div>"
              );
            }).join("") +
            "</details>";

          h +=
            '<details data-anim="r"><summary>Teks siap salin</summary><div class="stack" style="padding-top:12px">' +
            '<textarea class="textarea plain" id="plain" readonly>' +
            esc(plainText(r)) +
            "</textarea>" +
            '<div class="row"><button class="btn btn-primary" data-action="copy" id="copy-btn">Salin ringkasan</button><span class="muted" id="copy-msg"></span></div></div></details>';

          h +=
            '<div class="row" data-anim="r">' +
            '<button class="btn btn-primary" data-action="print">🖨️ Cetak / PDF</button>' +
            '<button class="btn btn-outline" data-action="tab" data-tab="history">📋 Ke Daftar Riwayat</button>' +
            '<button class="btn btn-outline" data-action="edit-answers">Ubah jawaban</button>' +
            '<button class="btn btn-ghost" data-action="restart">Wawancara baru</button>' +
            '</div></div>';
          return h;
        }

        function themeCard(id, snippets, isConcern) {
          var t = themeById(id),
            items = itemsFor(id);
          return (
            '<div class="card" data-anim="r"><div class="row between"><span class="card-title">' +
            esc(t.label) +
            "</span>" +
            '<span class="badge' +
            (isConcern ? " warn" : "") +
            '">' +
            (isConcern ? "Pertimbangan" : "Harapan") +
            "</span></div>" +
            '<div class="pair"><div class="stack" style="gap:8px"><span class="eyebrow">Kata ' +
            esc(sap()) +
            "</span>" +
            snippets
              .slice(0, 2)
              .map(function (s) {
                return '<p class="said">“' + esc(s) + "”</p>";
              })
              .join("") +
            "</div>" +
            '<div class="stack" style="gap:8px"><span class="eyebrow">Di ' +
            esc(state.school.name) +
            "</span>" +
            (items.length
              ? items.map(itemCard).join("")
              : '<div class="empty">Belum ada data sekolah untuk tema ini. Tambahkan di tab Data sekolah, atau jawab langsung saat wawancara.</div>') +
            "</div></div></div>"
          );
        }

        function closing(r) {
          var p = state.profile;
          if (!r.total)
            return (
              "Terima kasih sudah berbagi, " +
              sap() +
              " " +
              p.ortu +
              ". Kami ingin mengenal harapan untuk " +
              p.anak +
              " lebih jauh."
            );
          var names = r.order.slice(0, 3).map(function (id) {
            return themeById(id).label.toLowerCase();
          });
          if (!names.length)
            names = Object.keys(r.concerns)
              .slice(0, 3)
              .map(function (id) {
                return themeById(id).label.toLowerCase();
              });
          var list =
            names.length > 1
              ? names.slice(0, -1).join(", ") +
                " dan " +
                names[names.length - 1]
              : names[0];
          return (
            "Dari obrolan ini, " +
            sap() +
            " " +
            p.ortu +
            " mencari " +
            list +
            " untuk " +
            p.anak +
            ". " +
            state.school.name +
            " punya jawaban untuk " +
            r.covered +
            " dari " +
            r.total +
            " hal yang disampaikan, dan kami siap menjawab sisanya bersama-sama."
          );
        }

        function plainText(r) {
          var p = state.profile,
            L = [];
          L.push("RINGKASAN WAWANCARA – " + state.school.name.toUpperCase());
          L.push(
            "Orang tua: " +
              p.sapaan +
              " " +
              p.ortu +
              " | Calon murid: " +
              p.anak +
              (p.pewawancara ? " | Pewawancara: " + p.pewawancara : ""),
          );
          L.push("");
          function block(id, snips, tag) {
            var t = themeById(id);
            L.push(tag + " " + t.label);
            snips.slice(0, 2).forEach(function (s) {
              L.push("  " + sap() + ' menyampaikan: "' + s + '"');
            });
            var items = itemsFor(id);
            if (!items.length)
              L.push("  Data sekolah: belum tersedia, dijawab langsung.");
            items.forEach(function (it) {
              L.push(
                "  Sekolah: " +
                  it.title +
                  ". " +
                  it.detail +
                  (it.verified ? "" : " (data contoh, belum diverifikasi)"),
              );
            });
            L.push("");
          }
          r.order.forEach(function (id) {
            block(id, r.hits[id], "[Harapan]");
          });
          Object.keys(r.concerns).forEach(function (id) {
            block(id, r.concerns[id], "[Pertimbangan]");
          });
          L.push(closing(r));
          return L.join("\n");
        }

        function dataView() {

            return (

              id +
              '" data-sf="' +

              '" value="' +

          var h =
            '<div class="stack" style="gap:24px"><div class="stack" data-anim="in"><span class="eyebrow">Sumber jawaban penguat</span>' +
            '<h1 class="display result-title">Data sekolah</h1>' +
            '<p class="muted" style="max-width:64ch">Semua penguat di hasil wawancara berasal dari data ini. Perubahan tersimpan otomatis di browser ini saja. Data yang ditandai contoh belum diverifikasi, jadi ganti dengan data resmi sekolah.</p></div>' +
            '<div class="card" data-anim="in"><div class="card-title">Profil sekolah</div>' +
            '<div class="two">' +

            '<div class="two">' +

            f("sf-web", "Situs web", "website") +

            '<div class="two">' +
            f("sf-addr", "Alamat", "address") +
            f("sf-year", "Tahun berdiri", "founded") +
            "</div></div>" +
            '<div class="row between" data-anim="in"><div class="stat"><span class="badge ok">' +
            ver +
            ' terverifikasi</span><span class="badge warn">' +
            (s.items.length - ver) +
            " contoh</span></div>" +
            '<button class="btn btn-primary btn-sm" data-action="add-item">Tambah data</button></div><div class="stack">';
          s.items.forEach(function (it) {
            h +=
              '<div class="item-edit" data-anim="in"><div class="two"><div class="field"><label for="t-' +
              it.id +
              '">Judul</label><input class="input" id="t-' +
              it.id +
              '" data-if="title" data-id="' +

              '" value="' +

              '<div class="field"><label for="h-' +

              '">Tema</label><select class="select" id="h-' +
              it.id +
              '" data-if="theme" data-id="' +
              it.id +
              '">' +
              THEMES.map(function (t) {
                return (
                  '<option value="' +
                  t.id +
                  '"' +
                  (t.id === it.theme ? " selected" : "") +
                  ">" +
                  esc(t.label) +
                  "</option>"
                );
              }).join("") +
              "</select></div></div>" +
              '<div class="field"><label for="d-' +
              it.id +
              '">Keterangan</label><textarea class="textarea" style="min-height:64px" id="d-' +
              it.id +
              '" data-if="detail" data-id="' +
              it.id +
              '">' +
              esc(it.detail) +
              "</textarea></div>" +
              '<div class="two"><div class="field"><label for="s-' +
              it.id +
              '">Sumber</label><input class="input" id="s-' +
              it.id +
              '" data-if="source" data-id="' +
              it.id +
              '" value="' +
              esc(it.source || "") +
              '" placeholder="Contoh: Brosur PPDB 2026"></div>' +
              '<div class="row between" style="align-self:end"><label class="check"><input type="checkbox" id="v-' +
              it.id +
              '" data-if="verified" data-id="' +
              it.id +
              '"' +
              (it.verified ? " checked" : "") +
              ">Sudah diverifikasi</label>" +
              '<button class="btn btn-ghost btn-sm" data-action="del-item" data-id="' +

          });
          h +=
            '</div><details data-anim="in"><summary>Cadangkan atau pulihkan data (JSON)</summary><div class="stack" style="padding-top:12px">' +
            '<p class="muted">Salin teks ini untuk mencadangkan data. Untuk memulihkan atau memindahkan ke perangkat lain, tempel JSON lalu pilih Terapkan.</p>' +
            '<textarea class="textarea plain" id="json-box">' +
            esc(JSON.stringify(s, null, 2)) +

            '<div class="err" id="json-err" hidden></div><div class="row"><button class="btn btn-outline btn-sm" data-action="copy-json">Salin JSON</button>' +
            '<button class="btn btn-outline btn-sm" data-action="apply-json">Terapkan JSON</button><button class="btn btn-ghost btn-sm" data-action="reset-school">Kembalikan data bawaan</button><span class="muted" id="json-msg"></span></div></div></details></div>';
          return h;

        /* ---------- History View ---------- */
        function historyView() {
          var list = state.interviews || [];
          var q = (state.searchQuery || "").toLowerCase().trim();
          if (q) {
            list = list.filter(function (it) {
              return (
                (it.anak && it.anak.toLowerCase().indexOf(q) >= 0) ||
                (it.ortu && it.ortu.toLowerCase().indexOf(q) >= 0) ||
                (it.pewawancara && it.pewawancara.toLowerCase().indexOf(q) >= 0)
              );
            });
          }

          var fbStatusBadge = "";
          if (state.firebaseStatus === "connected") {
            fbStatusBadge =
              '<span class="badge ok" style="padding:4px 10px;font-size:12px;">☁️ Firebase Realtime Aktif</span>';
          } else if (state.firebaseStatus === "error") {
            fbStatusBadge =
              '<span class="badge" style="background:hsl(0 85% 95%);color:var(--danger);border-color:hsl(0 70% 80%);padding:4px 10px;font-size:12px;">⚠️ Error Firebase</span>';
          } else {
            fbStatusBadge =
              '<span class="badge warn" style="padding:4px 10px;font-size:12px;">💾 Mode Lokal (Belum terhubung Firebase)</span>';
          }

          var h =
            '<div class="stack" style="gap:20px">' +
            '<div class="stack" data-anim="in">' +
            '<span class="eyebrow">Daftar & Rekap Calon Murid</span>' +
            '<h1 class="display result-title">Riwayat Wawancara</h1>' +
            '<div class="row between" style="align-items:center;">' +
            '<p class="muted">Tercatat <b>' +
            state.interviews.length +
            "</b> calon murid dari kuota 65 orang tua.</p>" +
            fbStatusBadge +
            "</div></div>";

          if (state.firebaseStatus === "error") {
            h +=
              '<div class="notice" style="background:hsl(0 85% 96%);color:var(--danger);border-color:hsl(0 70% 80%);" data-anim="in"><b>Kendala Firestore:</b> ' +
              esc(state.firebaseError) +
              '<br><small style="margin-top:4px;display:block;">* Jika muncul <i>"Missing or insufficient permissions"</i>, buka Firebase Console > Firestore Database > Rules, lalu ganti rules menjadi:<br><code>rules_version = \'2\'; service cloud.firestore { match /databases/{database}/documents { match /{document=**} { allow read, write: if true; } } }</code></small></div>';
          } else if (state.firebaseStatus !== "connected") {
            h +=
              '<div class="notice" data-anim="in"><b>Tips Kolaborasi 10 Pewawancara:</b> Pastikan file <code>firebase-config.js</code> sudah terisi dengan benar agar hasil wawancara dari semua laptop langsung tersinkron otomatis ke sini secara realtime.</div>';
          }

          h +=
            '<div class="card" data-anim="in">' +
            '<div class="row between">' +
            '<div style="flex:1;min-width:240px;">' +
            '<input type="text" class="input" id="hist-search" placeholder="Ketik untuk memfilter nama anak, orang tua, atau pewawancara..." value="' +
            esc(state.searchQuery) +
            '">' +
            "</div>" +
            '<div class="row">' +
            '<button class="btn btn-outline btn-sm" data-action="export-csv">📥 Unduh Rekap Excel (CSV)</button>' +
            "</div>" +
            "</div></div>";

          if (!list.length) {
            h +=
              '<div class="empty" data-anim="in" style="text-align:center;padding:36px 20px;">' +
              (state.searchQuery
                ? 'Tidak ada calon murid yang cocok dengan kata kunci "' +
                  esc(state.searchQuery) +
                  '".'
                : "Belum ada riwayat wawancara. Silakan mulai sesi baru di tab Wawancara.") +
              "</div>";
          } else {
            h += '<div class="stack" data-anim="in" id="hist-list">';
            list.forEach(function (it) {
              h +=
                '<div class="hist-item">' +
                '<div class="stack" style="gap:4px;flex:1;min-width:200px;">' +
                '<div class="row" style="gap:8px;align-items:center;">' +
                '<span style="font-weight:600;font-size:15px;">' +
                esc(it.anak) +
                "</span>" +
                '<span class="badge">' +
                esc(it.sapaan || "Ortu") +
                " " +
                esc(it.ortu) +
                "</span>" +
                '<span class="badge ok">' +
                (it.percent || 0) +
                "% Selaras</span>" +
                "</div>" +
                '<div class="hist-meta">' +
                "<span>🗓️ " +
                esc(it.displayDate || "-") +
                "</span>" +
                "<span>👤 Pewawancara: " +
                esc(it.pewawancara || "Tidak dicatat") +
                "</span>" +
                "<span>🎯 " +
                (it.covered || 0) +
                "/" +
                (it.total || 0) +
                " harapan terjawab</span>" +
                "</div></div>" +
                '<div class="row" style="gap:8px;">' +
                '<button class="btn btn-primary btn-sm" data-action="view-history" data-id="' +
                esc(it.id) +
                '">Buka Ringkasan</button>' +
                '<button class="btn btn-ghost btn-sm" style="color:var(--danger);" data-action="del-history" data-id="' +
                esc(it.id) +
                '">Hapus</button>' +
                "</div></div>";
            });
            h += "</div>";
          }

          h += "</div>";
          return h;
        }

        function updateTabBadge() {
          var el = $("#badge-hist-count");
          if (el) {
            el.textContent =
              "(" + (state.interviews ? state.interviews.length : 0) + ")";
          }
        }

        /* ---------- Render ---------- */
        function render() {
          $("#tab-interview").setAttribute(
            "aria-selected",
            state.tab === "interview",
          );
          var th = $("#tab-history");
          if (th) th.setAttribute("aria-selected", state.tab === "history");
          $("#tab-data").setAttribute("aria-selected", state.tab === "data");
          updateTabBadge();
          $("#brand-sub").textContent = state.school.name;
          var v = $("#view"),
            html;
          if (state.tab === "history") html = historyView();
          else if (state.tab === "data") html = dataView();
          else if (state.done) html = resultView();
          else if (state.step === 0) html = startView();
          else html = questionView();
          v.innerHTML = html;
          lastThemes = {};
          if (state.tab === "interview" && !state.done && state.step > 0) {
            $("#answer").value = state.answers[state.step - 1] || "";
            updatePenguat();
            animFrom($(".step-card"), {
              opacity: 0,
              x: 16,
              duration: 0.4,
              ease: "power2.out",
            });
          }
          animFrom($$("[data-anim=in]", v), {
            opacity: 0,
            y: 14,
            duration: 0.45,
            stagger: 0.07,
            ease: "power2.out",
          });
          if (state.done && state.tab === "interview") {
            animFrom($$("[data-anim=r]", v), {
              opacity: 0,
              y: 18,
              duration: 0.5,
              stagger: 0.08,
              ease: "power2.out",
            });
            var G = g(),
              bar = $("#meter-bar"),
              num = $("#meter-num");
            if (G && bar)
              G.from(bar, {
                width: 0,
                duration: 0.9,
                ease: "power2.out",
                delay: 0.2,
              });
            if (G && num) {
              var o = { n: 0 },
                to = +num.getAttribute("data-to");
              G.to(o, {
                n: to,
                duration: 0.9,
                delay: 0.2,
                ease: "power1.out",
                onUpdate: function () {
                  num.textContent = Math.round(o.n);
                },
              });
            }
          }
        }

        var penguatTimer = null;
        function updatePenguat() {
          var box = $("#penguat");
          if (!box) return;
          var text = state.answers[state.step - 1] || "";
          var ms = analyze(text),
            html = "",
            cur = {};
          if (!text.trim()) {
            html =
              '<div class="empty">Mulai mengetik jawaban orang tua. Data sekolah yang relevan muncul di sini, siap dibacakan.</div>';
          } else if (!ms.length) {
            html =
              '<div class="empty">Belum ada kata kunci yang dikenali. Gali lebih dalam: minta contoh kejadian atau kebiasaan yang konkret.</div>';
          } else {
            ms.forEach(function (m) {
              cur[m.theme.id] = 1;
              var items = itemsFor(m.theme.id);
              html +=
                '<div class="group" data-theme="' +
                m.theme.id +
                '"><span class="eyebrow">' +
                esc(m.theme.label) +
                "</span>" +
                '<p class="said">“' +
                esc(m.snippet) +
                "”</p>" +
                (items.length
                  ? items.map(itemCard).join("")
                  : '<div class="empty">Belum ada data sekolah untuk tema ini. Tambahkan di tab Data sekolah.</div>') +
                "</div>";
            });
          }
          box.innerHTML = html;
          $("#pg-count").textContent = ms.length + " tema";
          var fresh = $$(".group", box).filter(function (el) {
            return !lastThemes[el.getAttribute("data-theme")];
          });
          animFrom(fresh, {
            opacity: 0,
            y: 12,
            duration: 0.4,
            stagger: 0.06,
            ease: "power2.out",
          });
          lastThemes = cur;
        }
        function schedulePenguat() {
          clearTimeout(penguatTimer);
          penguatTimer = setTimeout(updatePenguat, 280);
        }

        function handleCandidateAutocomplete(t) {
          if (!t || !t.id) return;
          var val = (t.value || "").trim().toLowerCase();
          if (!val) return;
          if (t.id === "p-id") {
            state.profile.id = t.value.trim();
            var found = candidatesData.filter(function (c) {
              return c.id.toLowerCase() === val;
            })[0];
            if (found) {
              state.profile.anak = found.anak;
              state.profile.ortu = found.ortu;
              state.profile.sapaan = found.sapaan || "Ayah/Bunda";
              var elAnak = $("#p-anak");
              var elOrtu = $("#p-ortu");
              if (elAnak) elAnak.value = found.anak;
              if (elOrtu) elOrtu.value = found.ortu;
            }
          } else if (t.id === "p-anak") {
            state.profile.anak = t.value.trim();
            var found = candidatesData.filter(function (c) {
              return c.anak.toLowerCase() === val;
            })[0];
            if (found) {
              state.profile.id = found.id;
              state.profile.ortu = found.ortu;
              state.profile.sapaan = found.sapaan || "Ayah/Bunda";
              var elId = $("#p-id");
              var elOrtu = $("#p-ortu");
              if (elId) elId.value = found.id;
              if (elOrtu) elOrtu.value = found.ortu;
            }
          } else if (t.id === "p-ortu") {
            state.profile.ortu = t.value.trim();
            var found = candidatesData.filter(function (c) {
              return c.ortu.toLowerCase() === val;
            })[0];
            if (found) {
              state.profile.id = found.id;
              state.profile.anak = found.anak;
              state.profile.sapaan = found.sapaan || "Ayah/Bunda";
              var elId = $("#p-id");
              var elAnak = $("#p-anak");
              if (elId) elId.value = found.id;
              if (elAnak) elAnak.value = found.anak;
            }
          }
        }

        /* ---------- Events ---------- */
        document.addEventListener("input", function (e) {
          var t = e.target;
          if (t.id === "answer") {
            state.answers[state.step - 1] = t.value;
            schedulePenguat();
          } else if (t.id === "hist-search") {
            state.searchQuery = t.value;
            var q = t.value.toLowerCase().trim();
            $$(".hist-item").forEach(function (el) {
              el.style.display =
                el.textContent.toLowerCase().indexOf(q) >= 0 ? "" : "none";
            });
          } else if (t.id === "p-id" || t.id === "p-anak" || t.id === "p-ortu") {
            handleCandidateAutocomplete(t);
          } else if (t.getAttribute && t.getAttribute("data-profile")) {
            state.profile[t.getAttribute("data-profile")] = t.value;
          } else if (t.getAttribute && t.getAttribute("data-sf")) {
            state.school[t.getAttribute("data-sf")] = t.value;
            saveSchool();
          } else if (t.getAttribute && t.getAttribute("data-if")) {
            var id = t.getAttribute("data-id");
            var it = state.school.items.filter(function (x) {
              return x.id === id;
            })[0];
            if (it) {
              it[t.getAttribute("data-if")] =
                t.type === "checkbox" ? t.checked : t.value;
              saveSchool();
            }
          }
        });

        document.addEventListener("change", function (e) {
          var t = e.target;
          if (t && (t.id === "p-id" || t.id === "p-anak" || t.id === "p-ortu")) {
            handleCandidateAutocomplete(t);
          } else if (t && t.getAttribute && t.getAttribute("data-profile")) {
            state.profile[t.getAttribute("data-profile")] = t.value;
          }
        });

        document.addEventListener("submit", function (e) {
          e.preventDefault();
          startInterview();
        });

        function startInterview() {
          var p = state.profile;
          if (!p.anak.trim()) {
            state.startErr =
              "Isi atau pilih nama calon murid terlebih dahulu.";
            var el = $("#start-err");
            if (el) {
              el.textContent = state.startErr;
              el.hidden = false;
            }
            return;
          }
          if (!p.pewawancara.trim()) {
            state.startErr = "Pilih nama pewawancara terlebih dahulu.";
            var el = $("#start-err");
            if (el) {
              el.textContent = state.startErr;
              el.hidden = false;
            }
            return;
          }
          state.startErr = "";
          state.step = 1;
          render();
        }

        function copyText(text, srcEl, msgEl) {
          function fallback() {
            if (srcEl) {
              srcEl.focus();
              srcEl.select();
            }
            if (msgEl)
              msgEl.textContent =
                "Teks terpilih. Tekan salin di perangkat Anda.";
          }
          try {
            navigator.clipboard.writeText(text).then(function () {
              if (msgEl) msgEl.textContent = "Tersalin.";
            }, fallback);
          } catch (err) {
            fallback();
          }
        }

        document.addEventListener("click", function (e) {
          var b = e.target.closest ? e.target.closest("[data-action]") : null;
          if (!b) return;
          var a = b.getAttribute("data-action");
          if (a === "tab") {
            state.tab = b.getAttribute("data-tab");
            render();
          } else if (a === "start") {
            e.preventDefault();
            startInterview();
          } else if (a === "next") {
            if (state.step < N) {
              state.step++;
            } else {
              state.done = true;
              saveCurrentInterview();
            }
            render();
            window.scrollTo(0, 0);
          } else if (a === "prev") {
            if (state.step > 0) state.step--;
            render();
          } else if (a === "chip") {
            var ta = $("#answer"),
              txt = QUESTIONS[state.step - 1].chips[+b.getAttribute("data-i")];
            var cur = ta.value.trim();
            ta.value =
              (cur ? cur.replace(/[.!?]*$/, ".") + " " : "") + txt + ".";
            state.answers[state.step - 1] = ta.value;
            ta.focus();
            updatePenguat();
          } else if (a === "print") {
            window.print();
          } else if (a === "export-csv") {
            exportCSV();
          } else if (a === "view-history") {
            var id = b.getAttribute("data-id");
            var target = state.interviews.filter(function (x) {
              return x.id === id;
            })[0];
            if (target) {
              state.profile = {
                id: target.candidateId || target.id || "",
                sapaan: target.sapaan || "Ayah/Bunda",
                ortu: target.ortu || "",
                anak: target.anak || "",
                pewawancara: target.pewawancara || "",
              };
              state.answers = (target.answers || []).slice();
              state.activeSessionId = target.id;
              state.done = true;
              state.tab = "interview";
              render();
              window.scrollTo(0, 0);
            }
          } else if (a === "del-history") {
            var id = b.getAttribute("data-id");
            deleteInterview(id);
          } else if (a === "edit-answers") {
            state.done = false;
            state.step = N;
            render();
          } else if (a === "restart") {
            state.answers = [];
            state.done = false;
            state.step = 0;
            state.profile.id = "";
            state.profile.ortu = "";
            state.profile.anak = "";
            state.profile.pewawancara = "";
            state.activeSessionId = null;
            render();
            window.scrollTo(0, 0);
          } else if (a === "copy") {
            copyText($("#plain").value, $("#plain"), $("#copy-msg"));
          } else if (a === "add-item") {
            state.school.items.unshift({
              id: "i" + Date.now(),
              theme: "agama",
              title: "Data baru",
              detail: "",
              verified: false,
              source: "",
            });
            saveSchool();
            render();
          } else if (a === "del-item") {
            var id = b.getAttribute("data-id");
            state.school.items = state.school.items.filter(function (x) {
              return x.id !== id;
            });
            saveSchool();
            render();
          } else if (a === "copy-json") {
            var jb = $("#json-box");
            jb.value = JSON.stringify(state.school, null, 2);
            copyText(jb.value, jb, $("#json-msg"));
          } else if (a === "apply-json") {
            var err = $("#json-err");
            try {
              var o = JSON.parse($("#json-box").value);
              if (!o || !Array.isArray(o.items)) throw new Error("bentuk");
              o.items.forEach(function (it, i) {
                it.id = it.id || "x" + i;
                it.theme = themeById(it.theme) ? it.theme : "agama";
                it.title = it.title || "";
                it.detail = it.detail || "";
                it.verified = !!it.verified;
                it.source = it.source || "";
              });
              state.school = o;
              saveSchool();
              render();
            } catch (x) {
              err.textContent =
                'JSON tidak valid. Pastikan ada daftar "items" dan formatnya utuh.';
              err.hidden = false;
            }
          } else if (a === "reset-school") {
            state.school = JSON.parse(JSON.stringify(DEFAULT_SCHOOL));
            saveSchool();
            render();
          }
        });

        /* ---------- Mulai ---------- */
        initFirebase();
        loadCandidates();
        render();
        animFrom($("#topbar"), {
          opacity: 0,
          y: -10,
          duration: 0.5,
          ease: "power2.out",
        });
      })();
    </script>
  </body>
</html>
