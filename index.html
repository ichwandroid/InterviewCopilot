<!doctype html>
<html>
  <head>
    <meta charset="utf8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="claude:viewport-fit-sides" content="cover" />
    <title>Interview Copilot Anak Saleh</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap"
    />
    <style>
      :root {
        color-scheme: light;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      body {
        margin: 0;
        padding: 0;
        font:
          14px -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        background: #fff;
        color: #000;
      }
      img {
        max-width: 100%;
      }
      [hidden]:not([hidden="until-found" i]) {
        display: none !important;
      }
    </style>
    <link rel="stylesheet" href="styles.css?v=2.3">
  </head>
  <body>
    <div class="wrap">
      <header class="topbar" id="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <i data-lucide="moon" style="width:20px;height:20px;"></i>
          </div>
          <div>
            <div class="brand-name">Ruang Ta'aruf</div>
            <div class="brand-sub" id="brand-sub">Sekolah Anak Saleh</div>
          </div>
        </div>
        <div class="tabs" role="tablist" aria-label="Menu">
          <button
            class="tab"
            role="tab"
            id="tab-interview"
            data-action="tab"
            data-tab="interview"
            aria-selected="true"
          >
            <i data-lucide="message-square"></i> Ta'aruf
          </button>
          <button
            class="tab"
            role="tab"
            id="tab-history"
            data-action="tab"
            data-tab="history"
            aria-selected="false"
          >
            <i data-lucide="history"></i> Riwayat <span id="badge-hist-count" style="font-size:11px;opacity:0.85;">(0)</span>
          </button>
          <button
            class="tab"
            role="tab"
            id="tab-data"
            data-action="tab"
            data-tab="data"
            aria-selected="false"
          >
            <i data-lucide="database"></i> Data sekolah
          </button>
        </div>
      </header>
      <main id="view"></main>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="app.js?v=3.0"></script>
  </body>
</html>
